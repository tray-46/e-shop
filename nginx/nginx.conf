events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_connect_timeout 10;
    proxy_send_timeout 15;
    proxy_read_timeout 20;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://django;
        }

        location /static/ {
            alias /app/staticfiles/;
        }
    }
}