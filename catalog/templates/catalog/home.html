{% extends "catalog/base.html" %}

{% block title %}Skystore: Главная страница{% endblock %}

{% block content %}
<div class="row text-center">
    {% for product in products %}
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ product.product_name }}</h4>
            </div>
            <div class="card-body">
                <h1 class="card-title pricing-card-title">$ {{ product.price }}</h1>
                <p>{{ product.product_description|truncatechars:100 }}</p>
                <a class="btn btn-lg btn-block btn-outline-primary" role="button" href="{% url 'catalog:product_details' product.pk %}">Детали</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
