{% extends "catalog/base.html" %}

{% block title %}Skystore: удаление продукта{% endblock %}

{% block content %}
<h1>Удаление продукта</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h3 class="my-3">Вы действительно хотите удалить "{{ product.product_name }}"?</h3>
    <div class="form-group">
        <button class="btn btn-lg btn-block btn-outline-primary w-auto" type="submit">Удалить</button>
        <a class="btn btn-lg btn-block btn-outline-primary w-auto ms-2" role="button"
           href="{{ request.META.HTTP_REFERER|default:'/' }}">Отмена</a>
    </div>
</form>

{% endblock %}
